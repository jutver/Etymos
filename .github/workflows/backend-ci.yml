# Backend tests. The server's auto-deploy (backend/scripts/deploy_watch.sh)
# only deploys a commit once the backend-tests check on it has passed.
name: Backend CI

on:
  push:
    branches: [main, dev]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          # CPU torch first: much smaller than the CUDA build in requirements.txt,
          # and the tests don't load models onto a GPU.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q
