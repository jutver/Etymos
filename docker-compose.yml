services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: etymos-api:latest
    container_name: etymos-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Backend-only secrets (see .env.backend.example). NOT the repo-root `.env`,
    # which the Vercel CLI writes for the frontend.
    env_file:
      - .env.backend
    # VPS has an NVIDIA GPU (used for the local Qwen2.5-1.5B metadata-extraction
    # path). Requires the NVIDIA Container Toolkit installed on the host
    # (see docs/DEPLOY_BACKEND.md). Remove this block if running CPU-only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
